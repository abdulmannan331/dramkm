# Decap CMS: the editor at dramkm.com/admin
# GitHub repo that stores the site content
backend:
  name: github
  repo: abdulmannan331/dramkm
  branch: main

# Lets you run the editor on your own computer too (npx decap-server)
local_backend: true

media_folder: images/uploads
public_folder: /images/uploads

collections:
  - name: site
    label: "Site content"
    files:
      # ---------- SETTINGS ----------
      - name: settings
        label: "⚙️ Site settings & features"
        file: data/settings.json
        format: json
        fields:
          - { name: site_title, label: "Browser tab title", widget: string }
          - { name: name, label: "Your name", widget: string }
          - { name: credentials, label: "Credentials (e.g., MD, MPH)", widget: string, required: false }
          - { name: position, label: "Position", widget: string }
          - { name: institution, label: "Institution / location", widget: string }
          - { name: tagline, label: "One-line tagline", widget: string, required: false }
          - { name: email, label: "Public email", widget: string, required: false }
          - { name: photo, label: "Profile photo", widget: image, required: false }
          - { name: cv, label: "CV (PDF)", widget: file, required: false }
          - { name: author_highlight, label: "Your name as it appears in author lists (bolded). Separate variants with ;", widget: string, required: false }
          - { name: accent_color, label: "Accent color", widget: color, required: false }
          - { name: show_research, label: "Show Research & Publications page", widget: boolean, default: true }
          - { name: show_projects, label: "Show Projects page", widget: boolean, default: true }
          - name: links
            label: "Profile links (leave URL blank to hide)"
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { name: label, label: "Label", widget: string }
              - { name: url, label: "URL", widget: string, required: false }
          - { name: footer_text, label: "Footer text", widget: string, required: false }

      # ---------- ABOUT ----------
      - name: about
        label: "👤 About page"
        file: data/about.json
        format: json
        fields:
          - { name: bio, label: "Bio (supports **bold**, *italic*, [links](url); blank line = new paragraph)", widget: text }
          - { name: research_interests, label: "Research interests", widget: list, field: { name: item, label: Interest, widget: string } }
          - name: appointments
            label: "Appointments"
            widget: list
            summary: "{{fields.role}}"
            fields:
              - { name: role, label: "Role", widget: string }
              - { name: place, label: "Institution", widget: string }
              - { name: years, label: "Years", widget: string }
          - name: education
            label: "Education & training"
            widget: list
            summary: "{{fields.degree}}"
            fields:
              - { name: degree, label: "Degree / program", widget: string }
              - { name: place, label: "Institution", widget: string }
              - { name: years, label: "Years", widget: string }
          - name: news
            label: "News & updates"
            widget: list
            summary: "{{fields.date}}: {{fields.text}}"
            fields:
              - { name: date, label: "Date (e.g., 2026-10)", widget: string }
              - { name: text, label: "Text", widget: string }

      # ---------- RESEARCH PAGE ----------
      - name: research
        label: "📄 Research & Publications page"
        file: data/research.json
        format: json
        fields:
          - { name: heading, label: "Page heading", widget: string }
          - { name: intro, label: "Intro text (blank line = new paragraph)", widget: text, required: false }
          - name: links
            label: "Profile links (e.g., PubMed, ResearchGate, Google Scholar)"
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { name: label, label: "Name", widget: string }
              - { name: url, label: "URL", widget: string }
              - { name: description, label: "Short description", widget: string, required: false }

      # ---------- COMING SOON ----------
      - name: coming_soon
        label: "⏳ Coming soon (Projects page)"
        file: data/coming-soon.json
        format: json
        fields:
          - { name: show, label: "Show this section", widget: boolean, default: true }
          - { name: heading, label: "Section heading", widget: string, default: "Coming soon" }
          - { name: intro, label: "Intro line (optional)", widget: string, required: false }
          - name: items
            label: "Coming soon items"
            label_singular: "item"
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: "Title", widget: string }
              - { name: description, label: "Short description (optional)", widget: text, required: false }
              - { name: link, label: "Link (optional)", widget: string, required: false }

      # ---------- PROJECTS ----------
      - name: projects
        label: "🔬 Projects"
        file: data/projects.json
        format: json
        fields:
          - name: items
            label: "Projects"
            label_singular: "project"
            widget: list
            summary: "{{fields.status}}: {{fields.title}}"
            fields:
              - { name: title, label: "Title", widget: string }
              - { name: status, label: "Status (optional)", widget: select, options: ["Ongoing", "Under review", "Published", "Completed", "Coming soon"], required: false }
              - { name: summary, label: "Summary (optional)", widget: text, required: false }
              - { name: data_sources, label: "Data sources (optional)", widget: list, field: { name: item, label: Source, widget: string }, required: false }
              - { name: methods, label: "Methods", widget: string, required: false }
              - { name: link, label: "Link (paper, poster, slides)", widget: string, required: false }
              - { name: file, label: "Upload a file (HTML tool, PDF, slides): drag and drop here", widget: file, required: false }
              - { name: button_label, label: "Button text (e.g., Try the IVUS tool)", widget: string, required: false }
              - { name: image, label: "Image / figure", widget: image, required: false }
              - { name: featured, label: "Show on home page", widget: boolean, default: false }
